services:
  - type: web
    name: homeserve-platform
    env: docker
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homeserve-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"

databases:
  - name: homeserve-db
    plan: free
    region: ohio
    databaseName: homeserve_db
    user: homeserve_user
