version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: homeserve-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-HomeServe@2026}
      MYSQL_DATABASE: homeserve_db
      MYSQL_USER: homeserve_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-HomeServe@Pass2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-HomeServe@2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - homeserve-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homeserve-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://homeserve_user:${MYSQL_PASSWORD:-HomeServe@Pass2026}@db:3306/homeserve_db
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production-2026}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-placeholder_secret}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-placeholder}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-placeholder}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-placeholder}
      FRONTEND_URL: http://localhost:5173
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - homeserve-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homeserve-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - homeserve-network

volumes:
  mysql_data:
    driver: local

networks:
  homeserve-network:
    driver: bridge

